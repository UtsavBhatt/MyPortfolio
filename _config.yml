title: "Utsav Bhatt"
email: "utsavbhattt@gmail.com"
description: >-
  Finance research, credit analysis, fixed income and data-led financial work.
url: "https://utsavbhatt.github.io"
baseurl: "/MyPortfolio"
repository: "UtsavBhatt/MyPortfolio"
minimal_mistakes_skin: "air"
search: false
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
permalink: /:categories/:title/
timezone: Asia/Kolkata
include:
  - _pages
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache
author:
  name: "Utsav Bhatt"
  avatar: "/assets/images/bio-photo.jpg"
  bio: "MBA Finance | Computer Science"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/utsav-bhatt1/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/UtsavBhatt"
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/utsav-bhatt1/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/UtsavBhatt"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      comments: false
      share: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
collections:
  projects:
    output: true
